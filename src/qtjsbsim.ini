aileron-axis=0
rudder-axis=2
throttle-axis=3
aileron-trim-axis=4
elevator-trim-axis=5
axis-0-deadband=0.02
axis-1-deadband=0.02
axis-2-deadband=0.02

[viewer]
localURL=http://localhost:8080/Apps/OTW/
remoteURL=http://daveshangar.org/viewer
use-local=false
