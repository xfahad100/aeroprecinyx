[cmdline]
executable=/home/dave/jsbsim-master/build/src/JSBSim
realtime=--realtime
aircraft=--aircraft=737
initfile=--initfile=reset00
arg1=--property=propulsion/engine[0]/set-running=1
arg2=--property=propulsion/engine[1]/set-running=1
arg3=--suspend
arg4=
arg5=
arg6=

[ports]
input=5138
output=5139
telnet=5137

[rates]
UI=100
output=10

[aircraft]
pitch-trim=-0.32
pitch-trim-rate=0.2

[joystick]
